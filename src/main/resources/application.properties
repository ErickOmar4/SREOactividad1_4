# ---------------------------------------------------------------------------
# Configuración de la aplicación
# ---------------------------------------------------------------------------

spring.application.name=act1-t4

# Puerto del servidor embebido (Tomcat).
#   - Por defecto 8080 (pruebas locales).
#   - En el VPS se sobrescribe sin recompilar, por ejemplo:
#         java -jar act1-t4.jar --server.port=8081
#     o con la variable de entorno SERVER_PORT=8081
server.port=${SERVER_PORT:8080}

# Muestra el mensaje de error (p. ej. "No existe la materia con id 99") en las respuestas 404
server.error.include-message=always

# ---------------------------------------------------------------------------
# Propiedades propias del proyecto (ver ProyectoProperties.java)
# TODO: reemplaza INICIALES y el nombre por los tuyos (apellidos + nombre)
# ---------------------------------------------------------------------------
proyecto.nombre=INICIALESact1_t4
proyecto.autor=Apellidos Nombre
proyecto.descripcion=API REST basica con Spring Boot - Actividad 1, Tema 4
